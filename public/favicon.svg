<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050914" />
      <stop offset="100%" stop-color="#0a1228" />
    </linearGradient>

    <!-- Logo Line Gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" /> <!-- Primary Blue -->
      <stop offset="100%" stop-color="#8b5cf6" /> <!-- Purple/Magenta Accent -->
    </linearGradient>

    <!-- Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Inner Cyber Grid lines (Subtle) -->
  <path d="M 128 0 V 512 M 256 0 V 512 M 384 0 V 512 M 0 128 H 512 M 0 256 H 512 M 0 384 H 512" 
        stroke="#3b82f6" stroke-width="1" stroke-opacity="0.1" />

  <!-- Center Group with Glow -->
  <g filter="url(#glow)">
    
    <!-- Letter 'O' Abstract Structure -->
    <path d="M 160 160
             A 96 96 0 0 0 160 352
             A 96 96 0 0 0 160 160 Z
             M 160 200
             A 56 56 0 0 1 160 312
             A 56 56 0 0 1 160 200 Z" 
          fill="none" stroke="url(#line-grad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Letter 'B' Abstract Structure -->
    <path d="M 280 160 H 350
             A 48 48 0 0 1 350 256
             H 280 Z
             M 280 256 H 360
             A 48 48 0 0 1 360 352
             H 280 Z
             M 280 160 V 352" 
          fill="none" stroke="url(#line-grad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Connection Nodes (Circuit dots) -->
    <circle cx="160" cy="160" r="16" fill="#22d3ee" />
    <circle cx="160" cy="352" r="16" fill="#22d3ee" />
    <circle cx="280" cy="160" r="16" fill="#22d3ee" />
    <circle cx="280" cy="256" r="16" fill="#22d3ee" />
    <circle cx="280" cy="352" r="16" fill="#22d3ee" />

  </g>
</svg>
